<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: range-card app. Brass marks what matters, steel-grey ground, OD green for "met". One column on phones. */
:root{
  --bg:#EEF0EC; --surface:#FAFAF7; --raise:#FFFFFF; --ink:#1B201C; --muted:#5B645D; --line:#D3D8D0;
  --brass:#946A17; --brass-ink:#FFFFFF; --brass-soft:#F3E8CF;
  --good:#2E7A4C; --good-soft:#DCEEE2; --warn:#A8701A; --warn-soft:#F6EBD6; --crit:#B23E2E; --crit-soft:#F7DFDA;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131618; --surface:#1A1E21; --raise:#21262A; --ink:#E6E8E3; --muted:#9BA39C; --line:#2F363A;
  --brass:#D4A54C; --brass-ink:#1A1408; --brass-soft:#3A3021;
  --good:#61BB86; --good-soft:#1E3327; --warn:#E2AA4E; --warn-soft:#3A2F1C; --crit:#E57A66; --crit-soft:#3D2420; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131618; --surface:#1A1E21; --raise:#21262A; --ink:#E6E8E3; --muted:#9BA39C; --line:#2F363A;
  --brass:#D4A54C; --brass-ink:#1A1408; --brass-soft:#3A3021;
  --good:#61BB86; --good-soft:#1E3327; --warn:#E2AA4E; --warn-soft:#3A2F1C; --crit:#E57A66; --crit-soft:#3D2420; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brandwrap{display:flex;align-items:center;gap:12px;min-width:0}
.backlib{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none;white-space:nowrap;padding:4px 9px;border:1px solid var(--line);border-radius:999px}
.backlib:hover{color:var(--ink);border-color:var(--muted)}
.brand span{color:var(--brass)}
.status{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--raise);color:var(--muted);font-size:12px;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.good .dot{background:var(--good)} .chip.warn .dot{background:var(--warn)} .chip.crit .dot{background:var(--crit)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:0}
nav.tabs button{font:600 13px var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:10px 14px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--brass)}
main{padding-block:20px 60px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,44px);line-height:1.02;letter-spacing:.01em;text-transform:uppercase}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
h3{font-size:15px;font-weight:600}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.btn{font:600 14px var(--f-body);padding:9px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--raise);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{font-size:12.5px;padding:5px 10px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{font:500 14px var(--f-body);padding:10px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--raise);color:var(--ink);cursor:pointer;text-align:left}
.pick[aria-pressed="true"]{border-color:var(--brass);background:var(--brass-soft);box-shadow:inset 0 0 0 1px var(--brass)}
.pick.big{padding:14px 16px;min-width:200px;flex:1 1 220px}
input[type=text],input[type=number],input[type=date],select,textarea{font:400 14px var(--f-body);padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise);color:var(--ink);min-width:0}
input[type=number]{width:110px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.setup{max-width:720px;margin:0 auto}
.progress{display:flex;gap:4px;margin-bottom:14px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--brass)}
.qnav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:22px;flex-wrap:wrap}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter b{display:block;height:100%;background:var(--good)}
.meter.warn b{background:var(--warn)} .meter.crit b{background:var(--crit)}
.pct{font:800 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.gap{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.flag{display:inline-block;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.flag.met{background:var(--good-soft);color:var(--good)} .flag.partial{background:var(--warn-soft);color:var(--warn)} .flag.missing{background:var(--crit-soft);color:var(--crit)}
.tag{font:500 11px var(--f-mono);color:var(--brass);letter-spacing:.04em}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
.gunrow{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise);cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.gunrow:hover{border-color:var(--muted)}
.gunrow .ty{font:700 13px var(--f-mono);color:var(--brass);min-width:78px;text-transform:uppercase;letter-spacing:.05em}
.gunrow .main{flex:1;min-width:0}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.badge{font:500 11px var(--f-mono);padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.badge.on{border-color:var(--good);color:var(--good)}
.banner{padding:12px 14px;border-radius:var(--r);border:1px solid var(--brass);background:var(--brass-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.crit{border-color:var(--crit);background:var(--crit-soft)}
.overlay{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(620px,100%);padding:20px;display:flex;flex-direction:column;gap:16px}
.ask{border:1px dashed var(--brass);border-radius:var(--r);padding:12px;background:var(--brass-soft)}
.month{border-left:3px solid var(--brass);padding:4px 0 4px 12px}
.planrow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.planrow .rk{font:700 18px var(--f-display);color:var(--brass)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat .v{font:800 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat .k{font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
textarea{width:100%;min-height:120px;font-family:var(--f-mono);font-size:12px}
.combo{position:relative;flex:1 1 240px;min-width:0}
.combo input{width:100%}
.combo-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--raise);border:1px solid var(--line);border-radius:var(--r);z-index:25;max-height:280px;overflow-y:auto;box-shadow:0 8px 24px rgb(0 0 0 / .18)}
.opt{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.opt[aria-selected="true"],.opt:hover{background:var(--brass-soft)}
.opt.own{border-top:1px solid var(--line);color:var(--brass);font-weight:600}
details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--brass);border-bottom:2px solid var(--brass);transform:rotate(-45deg);transition:transform .15s;flex:none}
details[open]>summary::before{transform:rotate(45deg)}
.h2like{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.03em;text-transform:uppercase}
.pri{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--muted)}
.pri.high{background:var(--crit)} .pri.med{background:var(--warn)} .pri.low{background:var(--good)}
.planrow.sugg{opacity:.92}
.planrow.sugg .rk{font:700 18px var(--f-display);color:var(--brass)}
.dropzone{border:1.5px dashed var(--line);border-radius:var(--r);padding:12px 14px;color:var(--muted)}
body.dragging::after{content:"Drop your Armory backup to restore it";position:fixed;inset:12px;z-index:40;display:flex;align-items:center;justify-content:center;border:3px dashed var(--brass);border-radius:12px;background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink);font:700 22px var(--f-display);letter-spacing:.04em;text-transform:uppercase;text-align:center;padding:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);z-index:30;font-size:14px}
@media (max-width:520px){ .gunrow .ty{min-width:60px} .pct{font-size:36px} }
@media (prefers-reduced-motion:no-preference){ .meter b{transition:width .4s ease} }
</style>

const RANGES=[["lt100","Under 100",50],["100_500","100–500",300],["500_1000","500–1,000",750],["1000p","1,000+",1000]];
const GEAR=[["spareMags","Spare mags"],["optic","Optic"],["light","Weapon light"],["sling","Sling"],["holster","Holster"],["ifak","IFAK / tourniquets"],["radios","Radios"],["bag","Get-home bag"]];
/* example per-round prices in cents, used only until the user logs a purchase */
const CPR={"5.56 / .223":40,"7.62x39":42,".300 BLK":85,".308":95,"5.45x39":45,"30-30":125,".22 LR":8,"6.5 Creedmoor":120,".30-06":130,".223":45,".300 Win Mag":200,"12 ga":75,"20 ga":60,".410":90,"9mm":28,"10mm":55,".40 S&W":33,".45 ACP":45,"5.7x28":60,".380":38,".38 Spl / .357":60,".44 Mag":90,".45 Colt":95};
const ACCCAT=[["optic","Optic"],["light","Weapon light"],["laser","Laser"],["mount","Optic mount"],["sights","Iron / night sights"],["grip","Grip"],["stock","Stock"],["choke","Choke"],["muzzle","Muzzle device / suppressor"],["sling","Sling"],["trigger","Trigger"],["handguard","Handguard / rail"],["other","Other"]];
const ACC_NAME=Object.fromEntries(ACCCAT);

 sights:["Magpul MBUS 3","Magpul MBUS Pro","Troy Folding BUIS","Daniel Defense Fixed Sights","XS Big Dot","XS DXT2","Trijicon HD Night Sights","Ameriglo Agent","Meprolight Tru-Dot","Dawson Precision Fiber Optic"],
 grip:["Magpul MOE Grip","Magpul MOE-K2","Magpul MOE+ Grip","BCM Gunfighter Mod 3","Hogue OverMolded AR Grip","Magpul RVG","Magpul AFG","Magpul MVG","BCM Vertical Grip Mod 3","Hogue Rubber Revolver Grips","Hogue HandAll Beavertail","Talon Grip Tape","FAB Defense AGR-47","Magpul MOE AK Grip","Strike Industries Grip"],
 stock:["Magpul CTR","Magpul MOE Carbine Stock","Magpul PRS Gen3","Magpul SL-S","BCM Gunfighter Mod 0","B5 Systems Bravo","Magpul SGA (870 / 500)","Mesa Tactical Urbino","Hogue OverMolded Shotgun Stock","Magpul Zhukov-S (AK)","Magpul Hunter (Rem 700)","Law Tactical Folding Adapter"],

const DEF_LONG=["rifle","pcc","shotgun"], HAND=["pistol","revolver"];
const STEPS=["welcome","goals","lacking","buy","types","calibers","ammo","gear","result"];

/* ---------- state ---------- */
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>new Date().toISOString().slice(0,10);
function fresh(){return {v:1,setupDone:false,step:"welcome",example:false,goals:[],lacking:[],buyNext:[],budget:100,getHomeMi:30,
  draft:{types:{},counts:{},ammoRange:{},gear:{}},guns:[],ammo:{},gear:{},costTracking:false,
  plan:{pinned:[],deferred:[],est:{},done:[]},log:[],purchases:[],acc:[],notes:[],list:[],
  meta:{changes:0,lastBackup:null,savedAt:null,created:new Date().toISOString()}};}
let S=fresh();
let UI={openMonths:null,openCats:{},pick:{},invQ:"",tab:"overview",modal:null,toast:null,persisted:null,fileHandle:null,fileOk:false,storageOk:true};

/* ---------- storage: IndexedDB + localStorage mirror ---------- */
const LS_KEY="aeglos-armory-v1";
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("aeglos-armory",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e)}});}
async function idbGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}catch(e){return undefined}}
async function idbSet(k,v){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});return true}catch(e){return false}}
let saveTimer=null;
function commit(countChange=true){ if(countChange) S.meta.changes++; S.meta.savedAt=new Date().toISOString(); render(); clearTimeout(saveTimer); saveTimer=setTimeout(persistNow,250); }
async function persistNow(){
  const json=JSON.stringify(S); let ok=false;
  try{localStorage.setItem(LS_KEY,json);ok=true}catch(e){}
  if(await idbSet("state",json)) ok=true;
  UI.storageOk=ok;
  if(UI.fileHandle&&UI.fileOk&&UI.fileChecked&&!UI.fileNewer){ try{const w=await UI.fileHandle.createWritable();await w.write(json);await w.close();}catch(e){UI.fileOk=false} }
  renderHeader();
}
async function loadState(){
  let a=null,b=null;
  try{const t=localStorage.getItem(LS_KEY); if(t) a=JSON.parse(t)}catch(e){}
  try{const t=await idbGet("state"); if(t) b=JSON.parse(t)}catch(e){}
  const pick=[a,b].filter(Boolean).sort((x,y)=>String(y.meta&&y.meta.savedAt).localeCompare(String(x.meta&&x.meta.savedAt)))[0];
  if(pick&&pick.v===1) S=migrate(Object.assign(fresh(),pick));
  try{const h=await idbGet("fileHandle"); if(h){UI.fileHandle=h; const p=h.queryPermission?await h.queryPermission({mode:"readwrite"}):"denied"; UI.fileOk=p==="granted";}}catch(e){}
  try{ if(navigator.storage&&navigator.storage.persisted) UI.persisted=await navigator.storage.persisted(); }catch(e){}
}
async function askPersist(){ try{ if(navigator.storage&&navigator.storage.persist){ UI.persisted=await navigator.storage.persist(); renderHeader(); } }catch(e){} }

function cpr(cal){ // dollars per round
  const lots=ammoOf(cal).lots.filter(l=>l.paid>0&&l.rounds>0);
  if(lots.length){const p=lots.reduce((s,l)=>s+l.paid,0), r=lots.reduce((s,l)=>s+l.rounds,0); return p/r;}
  return (CPR[cal]||60)/100;
}
const cprIsReal=cal=>ammoOf(cal).lots.some(l=>l.paid>0&&l.rounds>0);

function primaryLong(){
  const c=active().filter(g=>DEF_LONG.includes(g.type)); if(!c.length) return null;
  const flagged=c.find(g=>g.primary); if(flagged) return flagged;
  const rank={rifle:3,pcc:2,shotgun:1};
  return c.slice().sort((a,b)=>(rank[b.type]-rank[a.type])||(ammoOf(b.caliber).count-ammoOf(a.caliber).count))[0];
}
const handguns=()=>active().filter(g=>HAND.includes(g.type));
const firstHandgun=()=>{const h=handguns(); return h.find(g=>g.primary)||h.slice().sort((a,b)=>ammoOf(b.caliber).count-ammoOf(a.caliber).count)[0]||null;};

function R(id,label,weight,state,detail,fix){return {id,label,weight,state,detail,fix};}
function ammoState(cal,target){const c=ammoOf(cal).count; return c>=target?"met":c>=target*0.25?"partial":"missing";}
function fx(key,label,est,extra){return Object.assign({key,label,est},extra||{});}

const SCORED=["home","gethome","vehicle","hunting","training"];
function score(reqs){const tot=reqs.reduce((s,r)=>s+r.weight,0); const got=reqs.reduce((s,r)=>s+(r.state==="met"?r.weight:r.state==="partial"?r.weight/2:0),0); return tot?Math.round(got/tot*100):0;}
function profiles(){return S.goals.filter(p=>SCORED.includes(p)).map(p=>{const reqs=profileReqs(p);return {p,reqs,score:score(reqs)};});}
const LACK_MAP={ammo:/^(ammo|defammo)/,mags:/^mags/,optic_light:/^(light|optic|link:(light|optic))/,medical:/^ifak/,bag:/^bag/};
const BUY_MAP={gun:/^(buy_|handgun)/,ammo:/^(ammo|defammo)/,optics:/^(light|optic)/,mags:/^mags/,medical:/^ifak/};
function fixes(){
  const map={};
  profiles().forEach(({p,reqs})=>reqs.forEach(r=>{ if(!r.fix||r.state==="met") return;
    const f=r.fix, gain=r.state==="missing"?r.weight:r.weight/2;
    let key=f.key.startsWith("ammo:")?"ammo:"+f.cal:f.key;
    if(!map[key]) map[key]=Object.assign({},f,{key,gains:{}});
    const m=map[key];
    if(key.startsWith("ammo:")&&f.rounds>m.rounds){m.rounds=f.rounds; m.label=`${fmt(f.rounds)} rd of ${f.cal}`;}
    m.gains[p]=(m.gains[p]||0)+gain; }));
  return Object.values(map).map(f=>{
    if(f.key.startsWith("ammo:")||f.key.startsWith("defammo:")) f.est=f.rounds*cpr(f.cal);
    if(f.key.startsWith("mags:")) f.est=f.n*EST.mag;
    if(S.plan.est[f.key]!=null) f.est=+S.plan.est[f.key];
    f.flagged=Object.entries(LACK_MAP).some(([k,re])=>has(S.lacking,k)&&re.test(f.key));
    f.wanted=Object.entries(BUY_MAP).some(([k,re])=>has(S.buyNext,k)&&re.test(f.key));
    const pts=Object.values(f.gains).reduce((a,b)=>a+b,0), n=Object.keys(f.gains).length;
    f.pts=pts; f.prio=(pts*n*(f.flagged?1.5:1)*(f.wanted?1.25:1))/Math.max(f.est,1)+(f.est===0?1e6:0);
    f.pinned=has(S.plan.pinned,f.key); f.deferred=has(S.plan.deferred,f.key); f.listed=S.list.some(i=>i.fix===f.key&&i.status!=="bought");
    return f;
  }).sort((a,b)=>(b.pinned-a.pinned)||(a.deferred-b.deferred)||(b.prio-a.prio)||(isConsumable(b)-isConsumable(a)));
}
const isConsumable=f=>/^(ammo|defammo|ifak)/.test(f.key)?1:0;
function schedule(list){
  const B=Math.max(+S.budget||0,0), months=[], now=new Date(); let cash=0, i=0, q=list.slice();
  for(let m=0;m<12&&q.length;m++){
    const d=new Date(now.getFullYear(),now.getMonth()+m,1); cash+=B; const items=[];
    while(q.length&&q[0].est<=cash){const it=q.shift(); cash-=it.est; items.push(it);}
    months.push({label:d.toLocaleString("en-US",{month:"short",year:"numeric"}),items,saving:q.length?{item:q[0],cash}:null});
    if(B===0) break;
  }
  return {months,later:q};
}

/* ---------- caliber status ---------- */
function calibers(){
  const set=new Set(); active().forEach(g=>set.add(g.caliber)); Object.keys(S.ammo).forEach(c=>{if(S.ammo[c].count>0)set.add(c)});
  return [...set].map(cal=>{const guns=active().filter(g=>g.caliber===cal); const onlyBolt=guns.length&&guns.every(g=>g.type==="bolt");
    const target=cal===".22 LR"?1000:onlyBolt?200:defTarget(cal); const c=ammoOf(cal).count;
    const st=!guns.length?"none":c>=target?"met":c>=target*0.25?"partial":"missing"; return {cal,guns,target,count:c,st};})
    .sort((a,b)=>({missing:0,partial:1,met:2,none:3}[a.st]-{missing:0,partial:1,met:2,none:3}[b.st]));
}

/* ---------- render: header ---------- */
function statusChips(){
  if(!S.setupDone&&!S.guns.length) return `<span class="chip"><span class="dot"></span>Nothing saved yet</span>`;
  const out=[];
  out.push(UI.storageOk?`<span class="chip good"><span class="dot"></span>Saved on this device</span>`:`<span class="chip crit"><span class="dot"></span>This browser is not saving</span>`);
  out.push(UI.persisted?`<span class="chip good"><span class="dot"></span>Protected</span>`:`<span class="chip warn"><span class="dot"></span>Not protected from cleanup</span>`);
  if(UI.fileHandle) out.push(UI.fileOk?`<span class="chip good"><span class="dot"></span>Auto-saving to file</span>`:`<span class="chip warn"><span class="dot"></span>Auto-save file paused</span>`);
  const d=daysSince(S.meta.lastBackup);
  out.push(d==null?`<span class="chip warn"><span class="dot"></span>No backup yet</span>`:`<span class="chip ${d>30?"warn":"good"}"><span class="dot"></span>Backup ${d===0?"today":d+" days ago"}</span>`);
  return out.join("");
}

/* ---------- render: setup ---------- */
function progress(){const i=STEPS.indexOf(S.step); return `<div class="progress" aria-hidden="true">${STEPS.slice(1).map((s,j)=>`<i class="${j<i?"on":""}"></i>`).join("")}</div>`;}
function picks(list,arr,act,big){return `<div class="chips">${list.map(([k,n])=>`<button class="pick ${big?"big":""}" data-act="${act}" data-k="${k}" aria-pressed="${has(arr,k)}">${esc(n)}</button>`).join("")}</div>`;}
function qnav(next,label){const i=STEPS.indexOf(S.step); return `<div class="qnav"><button class="btn ghost" data-act="back">← Back</button><div class="row"><button class="btn ghost" data-act="next">Skip</button><button class="btn primary" data-act="${next||"next"}">${label||"Next →"}</button></div></div>`;}
function setupView(){
  const d=S.draft, st=S.step, n=STEPS.indexOf(st);
  if(st==="welcome") return `<div class="setup stack">
    ${fileNewerBanner()}
    <div class="banner" role="note"><strong>Organization and planning tool only.</strong><span class="small">Armory is not a legal tool and gives no legal advice. It doesn't tell you what you may own, carry, buy, or transfer where you live. Check your federal, state, and local laws.</span></div>
    <div class="eyebrow">Free · No account · Stays on this device</div>
    <h1>Know what you have.<br>Know what's missing.</h1>
    <p class="muted" style="max-width:60ch">Armory logs your guns, ammo, and gear, scores your setup against the goals you pick, and builds a month-by-month list of what to buy next. Setup takes about two minutes of tapping. You only type a make or model when a feature needs it.</p>
    <div class="row"><button class="btn primary" data-act="start">Start setup</button><button class="btn" data-act="example">See an example armory</button><label class="btn" for="restoreFile">Restore a backup</label><input id="restoreFile" type="file" accept=".json,application/json" hidden>${typeof window.showOpenFilePicker==="function"?'<button class="btn" data-act="openLink">Open my auto-save file</button>':""}</div>
    <div class="dropzone small">Have a backup file? Drop it anywhere on this page. Backups are named like <span class="mono">armory-2026-10-28-1452.json</span>.</div>
    <div class="card small muted">Your data is saved in this browser only. Nothing is sent to a server. A serial number is never required, and the app never asks where you keep anything.</div></div>`;
  let body="";
  if(st==="goals") body=`<div class="eyebrow">Step 1 of 7 · Goals</div><h2>What do you want your armory ready for?</h2><p class="muted small">Pick all that apply.</p>${picks(GOALS,S.goals,"goal",true)}
    ${has(S.goals,"gethome")?`<div class="card row"><label class="f" for="ghmi">How far is home from work, in miles?<input id="ghmi" type="number" min="1" max="200" value="${esc(S.getHomeMi)}" data-bind="getHomeMi"></label></div>`:""}`;
  if(st==="lacking") body=`<div class="eyebrow">Step 2 of 7 · Gaps you already feel</div><h2>What do you feel is lacking?</h2><p class="muted small">These get extra weight when the app ranks what to buy.</p>${picks(LACKING,S.lacking,"lack",true)}`;
  if(st==="buy") body=`<div class="eyebrow">Step 3 of 7 · Shopping list</div><h2>What do you want to buy next?</h2>${picks(BUYNEXT,S.buyNext,"buyn",true)}
    <div class="stack" style="gap:8px"><h3>Monthly gear budget <span class="muted small">(optional)</span></h3><div class="chips">${[50,100,250,500].map(v=>`<button class="pick" data-act="budget" data-k="${v}" aria-pressed="${+S.budget===v}">$${v}</button>`).join("")}<label class="f" for="budgetCustom">Custom<input id="budgetCustom" type="number" min="0" value="${[50,100,250,500].includes(+S.budget)?"":esc(S.budget)}" data-bind="budget" placeholder="$"></label></div></div>`;
  if(st==="types") body=`<div class="eyebrow">Step 4 of 7 · What you have</div><h2>Do you have a…</h2><p class="muted small">Pick every type you own. You'll pick calibers next.</p>${picks(TYPES,Object.keys(d.types).filter(k=>d.types[k]),"type",true)}`;
  if(st==="calibers"){ const ts=TYPES.filter(([k])=>d.types[k]);
    body=`<div class="eyebrow">Step 4a of 7 · Calibers</div><h2>Which calibers, and how many guns in each?</h2>
    ${ts.length?ts.map(([k,nm])=>{const sel=d.counts[k]||{}; const list=[...new Set([...CAL[k],...Object.keys(sel)])];
      return `<div class="card stack" style="gap:10px"><h3>${nm}</h3><div class="chips">${list.map(c=>`<button class="pick" data-act="cal" data-t="${k}" data-k="${esc(c)}" aria-pressed="${!!sel[c]}">${esc(c)}</button>`).join("")}</div>
      ${Object.keys(sel).length?`<div class="stack" style="gap:6px">${Object.entries(sel).map(([c,n])=>`<div class="row small"><span class="mono" style="min-width:120px">${esc(c)}</span><button class="btn sm" data-act="cnt" data-t="${k}" data-k="${esc(c)}" data-d="-1" aria-label="One fewer">−</button><span class="num mono">${n}</span><button class="btn sm" data-act="cnt" data-t="${k}" data-k="${esc(c)}" data-d="1" aria-label="One more">+</button><span class="muted">${n===1?"gun":"guns"}</span></div>`).join("")}</div>`:""}
      <div class="row"><input type="text" id="own-${k}" placeholder="Enter your own caliber" aria-label="Enter your own ${nm} caliber"><button class="btn sm" data-act="owncal" data-t="${k}">Add</button></div></div>`;}).join(""):`<p class="muted">No types picked. Go back to add some, or skip.</p>`}`;}
  if(st==="ammo"){ const cals=[...new Set(Object.values(d.counts).flatMap(o=>Object.keys(o)))];
    body=`<div class="eyebrow">Step 5 of 7 · Ammo</div><h2>Roughly how much ammo for each caliber?</h2><p class="muted small">A rough count is fine. You can make it exact later.</p>
    ${cals.length?cals.map(c=>`<div class="card stack" style="gap:8px"><h3 class="mono">${esc(c)}</h3><div class="chips">${RANGES.map(([k,n])=>`<button class="pick" data-act="range" data-c="${esc(c)}" data-k="${k}" aria-pressed="${d.ammoRange[c]===k}">${n}</button>`).join("")}</div></div>`).join(""):`<p class="muted">No calibers picked yet.</p>`}`;}
  if(st==="gear") body=`<div class="eyebrow">Step 6 of 7 · Gear check</div><h2>Do you have any of these?</h2>${picks(GEAR,Object.keys(d.gear).filter(k=>d.gear[k]),"gear",true)}`;
  if(st==="result"){ const ps=profiles(), fx0=fixes();
    body=`<div class="eyebrow">Step 7 of 7 · Your first score</div><h2>Here's where you stand</h2>
    ${ps.length?`<div class="grid">${ps.map(scoreCard).join("")}</div>`:`<p class="muted">You didn't pick a scored goal. Readiness scores cover home defense, get-home, vehicle, hunting, and training.</p>`}
    ${fx0.length?`<div class="card"><div class="eyebrow">First thing to buy</div><h3 style="margin-top:4px">${esc(fx0[0].label)}</h3><p class="small muted">${whyLine(fx0[0])} · ${fx0[0].est?money0(fx0[0].est)+" est.":"Free"}</p></div>`:""}`;
    return `<div class="setup stack">${progress()}${body}<div class="qnav"><button class="btn ghost" data-act="back">← Back</button><button class="btn primary" data-act="openArmory">Open my armory →</button></div></div>`; }
  return `<div class="setup stack">${progress()}${body}${qnav(st==="gear"?"finish":null, st==="gear"?"See my score →":null)}</div>`;
}

/* ---------- render: overview ---------- */
function band(s){return s>=75?"":s>=45?"warn":"crit";}
function scoreCard({p,reqs,score:s}){
  const gaps=reqs.filter(r=>r.state!=="met").sort((a,b)=>b.weight-a.weight);
  const top=gaps[0];
  return `<div class="card stack" style="gap:10px"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="eyebrow">${esc(GOAL_NAME[p])}${p==="gethome"?` · ${S.getHomeMi} mi`:""}</div><div class="pct">${s}%</div></div><span class="small muted">${top?`Main gap: ${esc(top.label)}`:"No gaps"}</span></div>
  <div class="meter ${band(s)}" role="img" aria-label="${s} percent ready"><b style="width:${s}%"></b></div>
  <div>${reqs.map(r=>`<div class="gap"><span class="flag ${r.state}">${r.state==="met"?"Met":r.state==="partial"?"Partial":"Missing"}</span><div><div class="small" style="font-weight:600">${esc(r.label)} <span class="muted mono" style="font-weight:400">· ${r.weight} pts</span></div><div class="small muted">${esc(r.detail)}</div></div></div>`).join("")}</div></div>`;
}
function whyLine(f){return Object.entries(f.gains).map(([p,v])=>`+${Math.round(v)} pts ${GOAL_NAME[p].toLowerCase()}`).join(", ");}
function overviewView(){
  const ps=profiles(), cals=calibers(), g=active();
  const total=g.reduce((s,x)=>s+allIn(x),0), stock=cals.reduce((s,c)=>s+c.count*cpr(c.cal),0);
  const nag=backupNag();
  return `<div class="stack">
  ${S.example?`<div class="banner"><strong>Example armory.</strong><span class="small">These are sample guns and counts, not yours.</span><button class="btn sm" data-act="clearExample" style="margin-left:auto">Clear it and start my own</button></div>`:""}
  ${fileNewerBanner()}
  ${nag}
  <div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="eyebrow">${g.length} guns · ${cals.length} calibers</div><h1>Readiness</h1></div>
  ${S.costTracking?`<div class="split" style="min-width:min(100%,340px)"><div class="stat"><div class="k">All-in, active guns</div><div class="v">${money0(total)}</div></div><div class="stat"><div class="k">Ammo on hand</div><div class="v">${money0(stock)}</div></div></div>`:""}</div>
  ${ps.length?`<div class="grid">${ps.map(scoreCard).join("")}</div>`:`<div class="card">Pick a scored goal in Backup &amp; settings to see readiness.</div>`}
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Caliber check</h2><button class="btn sm" data-act="tab" data-k="ammo">Open ammo</button></div>
  <div class="tbl" style="margin-top:8px"><table><thead><tr><th>Caliber</th><th class="r">On hand</th><th class="r">Target</th><th>Status</th><th>Guns</th></tr></thead><tbody>
  ${cals.map(c=>`<tr><td class="mono">${esc(c.cal)}</td><td class="r num">${fmt(c.count)}${ammoOf(c.cal).approx&&!ammoOf(c.cal).lots.length?' <span class="muted small">(rough)</span>':""}</td><td class="r num muted">${fmt(c.target)}</td><td>${c.st==="none"?'<span class="small muted">No gun uses it</span>':`<span class="flag ${c.st}">${c.st==="met"?"Good":c.st==="partial"?"Low":"Critical"}</span>`}</td><td class="small muted">${c.guns.length}</td></tr>`).join("")||`<tr><td colspan="5" class="muted">No guns logged yet.</td></tr>`}
  </tbody></table></div></div>
  ${has(S.goals,"collecting")?`<div class="card"><h2>Collecting and builds</h2><p class="small muted">${g.filter(x=>x.make||x.model).length} of ${g.length} guns have make and model filled in.${S.costTracking?` All-in cost across active guns: ${money0(total)}.`:" Turn on cost tracking in settings to see what each gun has cost."}</p></div>`:""}
  </div>`;
}
function backupNag(){
  if(!S.guns.length) return "";
  const d=daysSince(S.meta.lastBackup);
  if(S.meta.changes>=10||d==null&&S.meta.changes>=3||(d!=null&&d>=30)) return `<div class="banner ${d==null?"":"crit"}"><strong>${S.meta.changes} changes since your last backup.</strong><span class="small">Clearing site data or switching browsers would lose them.</span><button class="btn sm primary" data-act="download" style="margin-left:auto">Download backup</button></div>`;
  return "";
}

/* ---------- render: inventory ---------- */
function inventoryView(){
  const q=(UI.invQ||"").toLowerCase().trim(), ct=S.costTracking;
  const match=g=>!q||[gunName(g),g.make,g.model,...accOf(g).map(a=>a.name+" "+ACC_NAME[a.cat])].join(" ").toLowerCase().includes(q);
  const groups=TYPES.map(([k,n])=>[k,n,S.guns.filter(g=>g.type===k&&match(g))]).filter(x=>x[2].length);
  const act=active(), mags=act.reduce((s,g)=>s+(+g.mags||0),0), spares=S.acc.filter(a=>!a.gun);
  const mounted=S.acc.filter(a=>a.gun).length;
  const total=act.reduce((s,g)=>s+allIn(g),0)+spares.reduce((s,a)=>s+(+a.cost||0),0);
  return `<div class="stack"><div class="row" style="justify-content:space-between"><h1>Inventory</h1><div class="row"><button class="btn" data-act="addSpare">Add spare gear</button><button class="btn primary" data-act="addGun">Add a gun</button></div></div>
  <div class="card split">
    <div class="stat"><div class="k">Active guns</div><div class="v">${act.length}</div></div>
    <div class="stat"><div class="k">Accessories mounted</div><div class="v">${mounted}</div></div>
    <div class="stat"><div class="k">Spare gear</div><div class="v">${spares.length}</div></div>
    <div class="stat"><div class="k">Magazines</div><div class="v">${mags}</div></div>
    ${ct?`<div class="stat"><div class="k">Total invested</div><div class="v">${money0(total)}</div></div>`:""}
  </div>
  <div class="row"><input type="text" id="inv-q" value="${esc(UI.invQ||"")}" placeholder="Search guns, calibers, or accessories" aria-label="Search inventory" style="flex:1 1 260px"></div>
  ${groups.length?groups.map(([k,n,list])=>`<div class="stack" style="gap:8px"><div class="eyebrow">${n} · ${list.length}</div>${list.map(gunRow).join("")}</div>`).join(""):`<div class="card">${q?"Nothing matches that search.":"No guns yet. Add your first one."}</div>`}
  <div class="card stack" style="gap:10px"><div class="row" style="justify-content:space-between"><h2>Spare gear, not mounted</h2><button class="btn sm" data-act="addSpare">Add</button></div>
  <p class="small muted">Optics, lights, chokes, and other parts sitting in a drawer. Mount one on a gun when you put it on.</p>
  ${spares.length?`<div class="tbl"><table><thead><tr><th>Type</th><th>Item</th>${ct?'<th class="r">Paid</th>':""}<th>Mount on</th><th></th></tr></thead><tbody>${spares.map(a=>`<tr><td class="small muted">${esc(ACC_NAME[a.cat])}</td><td>${esc(a.name)}</td>${ct?`<td class="r num">${a.cost?money(+a.cost):""}</td>`:""}<td><select id="mnt-${a.id}" data-mount="${a.id}" aria-label="Mount ${esc(a.name)} on a gun"><option value="">Choose a gun</option>${act.filter(g=>CAT_OK(a.cat,g.type)).map(g=>`<option value="${g.id}">${esc(gunLabel(g))} (${esc(g.caliber)})</option>`).join("")}</select></td><td class="r"><button class="btn sm ghost" data-act="accDel" data-id="${a.id}" aria-label="Remove ${esc(a.name)}">✕</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="small muted">None logged.</p>`}</div>
  ${ct&&S.purchases.length?`<div class="card"><h2>Purchase log</h2><div class="tbl"><table><thead><tr><th>Date</th><th>Item</th><th class="r">Paid</th></tr></thead><tbody>${S.purchases.slice().reverse().slice(0,15).map(p=>`<tr><td class="mono small">${esc(p.date)}</td><td>${esc(p.label)}</td><td class="r num">${money(p.paid)}</td></tr>`).join("")}</tbody></table></div></div>`:""}</div>`;
}
function gunRow(g){
  const serial=g.serialWanted===true&&g.serial?`<span class="badge on">Serial on file</span>`:g.serialWanted===false?"":`<span class="badge" style="border-color:var(--brass);color:var(--brass)">Serial? Yes / No</span>`;
  const st=g.status!=="active"?`<span class="badge">${esc(g.status)}</span>`:"";
  const acc=accOf(g), magFed=!["shotgun","revolver"].includes(g.type);
  return `<button class="gunrow" data-act="editGun" data-id="${g.id}"><span class="ty">${esc(g.caliber)}</span><span class="main"><strong>${esc(gunLabel(g))}</strong>${g.make||g.model?` <span class="muted small">${esc(TYPE_NAME[g.type])}${g.barrel?`, ${esc(g.barrel)} in`:""}</span>`:` <span class="muted small">· add make and model</span>`}
  ${acc.length?`<span class="small" style="display:block;margin-top:2px">${acc.map(a=>`<span class="muted">${esc(ACC_NAME[a.cat])}:</span> ${esc(a.name)}`).join(" · ")}</span>`:`<span class="small muted" style="display:block;margin-top:2px">No accessories logged</span>`}
  <span class="badges">${g.primary?'<span class="badge on">Primary</span>':""}${magFed?`<span class="badge ${g.mags>0?"on":""}">${+g.mags||0} mags</span>`:""}${serial}${st}</span></span>
  ${S.costTracking?`<span class="num mono small">${money0(allIn(g))}</span>`:""}</button>`;
}
/* searchable accessory picker: category + dropdown search + "Add your own" */
function accPicker(ctx,gunType){
  const st=UI.pick[ctx]||(UI.pick[ctx]={cat:CAT_OK("optic",gunType)?"optic":"light",q:"",cost:""});
  if(!CAT_OK(st.cat,gunType)) st.cat="light";
  const cats=ACCCAT.filter(([k])=>CAT_OK(k,gunType));
  return `<div class="stack" style="gap:8px"><div class="row" style="align-items:flex-end">
   <label class="f" for="ap-cat-${ctx}">Type<select id="ap-cat-${ctx}" data-pickcat="${ctx}">${cats.map(([k,n])=>`<option value="${k}" ${st.cat===k?"selected":""}>${n}</option>`).join("")}</select></label>
   <div class="combo"><label class="f" for="ap-q-${ctx}">Search or type your own
   <input id="ap-q-${ctx}" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="ap-list-${ctx}" autocomplete="off" data-combo="${ctx}" value="${esc(st.q)}" placeholder="e.g. ${esc((CATALOG[st.cat]||[""])[0])}"></label>
   <div class="combo-list" id="ap-list-${ctx}" role="listbox" hidden></div></div>
   ${S.costTracking?`<label class="f" for="ap-cost-${ctx}">Paid ($)<input id="ap-cost-${ctx}" type="number" min="0" step="0.01" value="${esc(st.cost)}" data-pickcost="${ctx}" style="width:100px"></label>`:""}
   <button class="btn primary" data-act="accAdd" data-ctx="${ctx}">Add</button></div></div>`;
}
function comboList(ctx){
  const st=UI.pick[ctx]; const box=document.getElementById("ap-list-"+ctx), inp=document.getElementById("ap-q-"+ctx); if(!st||!box||!inp) return;
  const q=st.q.trim(), hits=catalogSearch(st.cat,q).slice(0,8);
  const exact=hits.some(h=>h.toLowerCase()===q.toLowerCase());
  st.opts=[...hits.map(h=>({v:h})), ...(q&&!exact?[{v:q,own:true}]:[])];
  if(st.hi==null||st.hi>=st.opts.length) st.hi=0;
  box.innerHTML=st.opts.length?st.opts.map((o,i)=>`<button type="button" class="opt ${o.own?"own":""}" role="option" id="ap-o-${ctx}-${i}" aria-selected="${i===st.hi}" data-act="comboPick" data-ctx="${ctx}" data-i="${i}">${o.own?`Add your own: “${esc(o.v)}”`:esc(o.v)}</button>`).join(""):`<div class="opt muted">Type a name to add your own</div>`;
  box.hidden=false; inp.setAttribute("aria-expanded","true"); if(st.opts.length) inp.setAttribute("aria-activedescendant","ap-o-"+ctx+"-"+st.hi);
}
function comboClose(ctx){const box=document.getElementById("ap-list-"+ctx), inp=document.getElementById("ap-q-"+ctx); if(box) box.hidden=true; if(inp){inp.setAttribute("aria-expanded","false"); inp.removeAttribute("aria-activedescendant");}}
function addSpareModal(){
  return `<div class="overlay" data-act="closeBg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="sp-h"><div class="row" style="justify-content:space-between"><h2 id="sp-h">Add spare gear</h2><button class="btn ghost" data-act="close" aria-label="Close">✕</button></div>
  <p class="small muted">For parts you own that aren't on a gun right now. You can mount them later from the Inventory tab.</p>
  ${accPicker("spare",null)}
  ${S.acc.filter(a=>!a.gun).length?`<div class="small muted">Spare gear logged: ${S.acc.filter(a=>!a.gun).map(a=>esc(a.name)).join(", ")}</div>`:""}
  <div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Done</button></div></div></div>`;
}
function gunModal(g){
  const ct=S.costTracking, nm=gunName(g);
  const still=fixes().filter(f=>f.gun===g.id).reduce((s,f)=>s+f.est,0);
  const serialBlock=g.serialWanted==null?`<div class="ask stack" style="gap:8px"><strong>Do you want a serial number associated with this ${esc(nm)}?</strong><span class="small muted">Optional. Handy for insurance or a theft report. It's masked on screen and left out of anything you share.</span><div class="row"><button class="btn sm primary" data-act="serial" data-v="yes">Yes</button><button class="btn sm" data-act="serial" data-v="no">No</button></div></div>`
    :g.serialWanted?`<div class="stack" style="gap:6px"><label class="f" for="g-serial">Serial number<input id="g-serial" type="text" value="${esc(g.serial||"")}" data-gbind="serial" autocomplete="off" ${UI.showSerial?"":'style="-webkit-text-security:disc"'}></label><div class="row small"><button class="btn sm ghost" data-act="showSerial">${UI.showSerial?"Hide":"Show"}</button><button class="btn sm ghost" data-act="serial" data-v="no">Remove serial</button></div></div>`
    :`<div class="row small muted">No serial saved. <button class="btn sm ghost" data-act="serial" data-v="ask">Change</button></div>`;
  const accs=accOf(g);
  const accBlock=`<div class="card stack" style="gap:10px"><h3>Accessories</h3>
   ${accs.length?`<div class="stack" style="gap:0">${accs.map(a=>`<div class="row" style="justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)"><div style="min-width:0;flex:1 1 200px"><div class="small muted">${esc(ACC_NAME[a.cat])}</div><div>${esc(a.name)}</div></div>${ct?`<label class="f" for="ac-cost-${a.id}">Paid<input id="ac-cost-${a.id}" type="number" min="0" step="0.01" value="${esc(a.cost||"")}" data-accost="${a.id}" style="width:100px"></label>`:""}<div class="row" style="gap:4px"><button class="btn sm ghost" data-act="accUnmount" data-id="${a.id}">Unmount</button><button class="btn sm ghost" data-act="accDel" data-id="${a.id}" aria-label="Remove ${esc(a.name)}">✕</button></div></div>`).join("")}</div>`:`<p class="small muted">Nothing logged yet. Add optics, lights, lasers, grips, stocks${g.type==="shotgun"?", chokes":""}, and more.</p>`}
   ${S.acc.some(a=>!a.gun&&CAT_OK(a.cat,g.type))?`<div class="row small"><span class="muted">From your spare gear:</span>${S.acc.filter(a=>!a.gun&&CAT_OK(a.cat,g.type)).map(a=>`<button class="btn sm" data-act="accMountHere" data-id="${a.id}">Mount ${esc(a.name)}</button>`).join("")}</div>`:""}

const LISTCAT=[["firearm","Firearms"],["ammo","Ammo"],["optics","Optics & accessories"],["mags","Magazines"],["medical","Medical"],["gear","Gear & carry"],["parts","Parts & builds"],["other","Other"]];
const LISTCAT_NAME=Object.fromEntries(LISTCAT);
const PRIO=[["high","High"],["med","Medium"],["low","Low"]];
const GEARFLAG={medical:[["ifak","IFAK / tourniquets"],["","Other medical"]],gear:[["holster","Holster"],["bag","Get-home bag"],["radios","Radios"],["sling","Sling"],["","Other gear"]]};
const ym=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
function windowMonths(){const n=new Date(); return [0,1,2].map(i=>{const d=new Date(n.getFullYear(),n.getMonth()+i,1); return {key:ym(d),label:d.toLocaleString("en-US",{month:"long",year:"numeric"}),short:d.toLocaleString("en-US",{month:"short"})};});}
function effMonth(it){ if(!it.month||it.month==="someday") return "someday"; const cur=windowMonths()[0].key; return it.month<cur?cur:it.month; }
const itemCost=it=>(+it.est||0)*(it.cat==="ammo"?1:Math.max(1,+it.qty||1));
function fixToItem(f,month){
  const it={id:uid(),fix:f.key,name:f.label,est:Math.round(f.est*100)/100,qty:1,prio:f.flagged||f.wanted?"high":"med",month:month||windowMonths()[0].key,url:"",notes:"",status:"want"};
  const k=f.key;
  if(k.startsWith("ammo:")||k.startsWith("defammo:")) Object.assign(it,{cat:"ammo",cal:f.cal,rounds:f.rounds,load:f.def?"defensive":"practice"});
  else if(k.startsWith("mags:")) Object.assign(it,{cat:"mags",gun:f.gun,qty:f.n,est:EST.mag});
  else if(/^(light|optic|sling):/.test(k)) Object.assign(it,{cat:"optics",accCat:k.split(":")[0],gun:f.gun});
  else if(k==="ifak") Object.assign(it,{cat:"medical",gearFlag:"ifak"});
  else if(["holster","bag","radios"].includes(k)) Object.assign(it,{cat:"gear",gearFlag:k});
  else if(f.kind==="gun") Object.assign(it,{cat:"firearm",gunType:k==="handgun"?"pistol":k==="buy_hunting"?"bolt":"rifle"});
  else it.cat="other";
  return it;
}
function planView(){
  const months=windowMonths(), B=Math.max(+S.budget||0,0), lead=profiles()[0];
  const sugg=fixes().filter(f=>!f.listed&&!f.deferred), deferred=fixes().filter(f=>f.deferred&&!f.listed);
  const open=S.list.filter(i=>i.status!=="bought");
  if(!UI.openMonths) UI.openMonths={[months[0].key]:true};
  let cash=0, q=sugg.filter(f=>!f.free), proj=lead?lead.score:0;
  const freeOnes=sugg.filter(f=>f.free);
  const monthBlocks=months.map((m,mi)=>{
    cash+=B; const planned=open.filter(i=>effMonth(i)===m.key); const pc=planned.reduce((s,i)=>s+itemCost(i),0); cash-=pc;
    const picks=[]; while(q.length&&q[0].est<=cash){const f=q.shift(); cash-=f.est; picks.push(f);}
    const gain=lead?planned.reduce((s,i)=>{const f=fixes().find(x=>x.key===i.fix); return s+(f&&f.gains[lead.p]||0);},0)+picks.reduce((s,f)=>s+(f.gains[lead.p]||0),0):0;
    proj=Math.min(100,Math.round(proj+gain));
    const over=cash<0;
    const isOpen=!!UI.openMonths[m.key];
    return `<details class="card month-card" ${isOpen?"open":""} data-month="${m.key}"><summary><div class="row" style="justify-content:space-between;flex:1"><span><span class="eyebrow">${mi===0?"This month":mi===1?"Next month":"In 2 months"}</span><br><strong class="h2like">${m.label}</strong></span>
      <span class="small mono" style="text-align:right">${planned.length} planned · ${money0(pc)}${B?` of ${money0(B)}`:""}${picks.length?` · ${picks.length} suggested`:""}${over?` <span class="flag missing">Over by ${money0(-cash)}</span>`:""}${lead?`<br><span class="muted">${esc(GOAL_NAME[lead.p])} → ${proj}%</span>`:""}</span></div></summary>
      <div class="stack" style="gap:4px;margin-top:10px">
      <div class="eyebrow" style="color:var(--muted)">Planned</div>
      ${planned.length?planned.map(i=>itemRow(i,true)).join(""):`<p class="small muted">Nothing planned. Add a suggestion below or set an item from your purchase list to ${m.short}.</p>`}
      ${mi===0&&freeOnes.length?`<div class="eyebrow" style="color:var(--muted);margin-top:10px">Free fixes</div>${freeOnes.map(f=>suggRow(f,m.key)).join("")}`:""}
      ${picks.length?`<div class="eyebrow" style="color:var(--muted);margin-top:10px">Suggested to fit your budget</div>${picks.map(f=>suggRow(f,m.key)).join("")}`:""}
      ${q.length&&mi===2?"":""}
      ${q.length&&cash>0&&q[0]?`<div class="small muted" style="padding-top:8px">Saving toward <strong>${esc(q[0].label)}</strong>: ${money0(cash)} of ${money0(q[0].est)}</div>`:""}
      </div></details>`;}).join("");
  const later=open.filter(i=>effMonth(i)==="someday"||effMonth(i)>months[2].key);
  const bought=S.list.filter(i=>i.status==="bought").sort((a,b)=>String(b.boughtDate).localeCompare(String(a.boughtDate)));
  return `<div class="stack"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="eyebrow">Rolling 90 days</div><h1>Buy next</h1></div>
  <label class="f" for="plan-budget">Monthly budget ($)<input id="plan-budget" type="number" min="0" value="${esc(S.budget)}" data-bind="budget"></label></div>

/* ---------- main render ---------- */
function render(){
  const app=document.getElementById("app");
  const focusId=document.activeElement&&document.activeElement.id, sel=document.activeElement&&document.activeElement.selectionStart;
  let inner;
  if(!S.setupDone) inner=setupView();
  else inner={overview:overviewView,inventory:inventoryView,ammo:ammoView,notes:notesView,plan:planView,backup:backupView}[UI.tab]();
  let modal="";
  if(UI.modal&&UI.modal.t==="gun"){const g=S.guns.find(x=>x.id===UI.modal.id); if(g) modal=gunModal(g); else UI.modal=null;}
  if(UI.modal&&UI.modal.t==="add") modal=addGunModal();
  if(UI.modal&&UI.modal.t==="spare") modal=addSpareModal();
  if(UI.modal&&UI.modal.t==="item") modal=itemModal();
  if(UI.modal&&UI.modal.t==="restore"&&UI.pendingRestore) modal=restoreModal();
  if(UI.modal&&UI.modal.t==="itemBuy"){const it=S.list.find(x=>x.id===UI.modal.id); if(it) modal=itemBuyModal(it); else UI.modal=null;}
  if(UI.modal&&UI.modal.t==="bought"){const f=fixes().find(x=>x.key===UI.modal.k); if(f) modal=boughtModal(f); else UI.modal=null;}
  app.innerHTML=shell(inner)+modal+(UI.toast?`<div class="toast" role="status">${esc(UI.toast)}</div>`:"");
  if(focusId){const el=document.getElementById(focusId); if(el){el.focus(); try{if(sel!=null&&el.setSelectionRange&&el.type==="text") el.setSelectionRange(sel,sel);}catch(e){}}}
}
function toast(msg){UI.toast=msg; render(); clearTimeout(toast.t); toast.t=setTimeout(()=>{UI.toast=null;render();},2600);}

/* ---------- inventory/plan actions ---------- */
function applyBought(f,fd){
  const paid=+fd.get("paid")||0, date=fd.get("date")||today();
  const k=f.key;
  if(k.startsWith("ammo:")||k.startsWith("defammo:")){ const r=+fd.get("rounds")||f.rounds, type=fd.get("type"); addAmmo(f.cal,r,paid,type,date); }
  else if(k.startsWith("mags:")){ const g=S.guns.find(x=>x.id===f.gun); const n=+fd.get("n")||f.n; if(g){g.mags=(+g.mags||0)+n; g.magCost=(+g.magCost||0)+paid;} }
  else if(/^(light|optic|sling):/.test(k)){ const part=k.split(":")[0]; const g=S.guns.find(x=>x.id===f.gun); const name=String(fd.get("name")||"").trim()||ACC_NAME[part]; S.acc.push({id:uid(),cat:part,name,gun:g?g.id:null,cost:paid||""}); S.gear[part]=true; }
  else if(["holster","ifak","radios","bag"].includes(k)) S.gear[k]=true;
  if(!k.startsWith("ammo:")&&!k.startsWith("defammo:")) S.purchases.push({date,label:f.label,paid});
  S.plan.pinned=S.plan.pinned.filter(x=>x!==k); delete S.plan.est[k];
}
function addAmmo(cal,rounds,paid,type,date){
  const a=S.ammo[cal]||(S.ammo[cal]={count:0,defensive:0,lots:[]});
  a.count+=rounds; if(type==="defensive") a.defensive+=rounds; a.lots.push({rounds,paid,type,date}); a.approx=false;
  S.log.push({date,cal,delta:rounds,reason:"bought",type,cost:paid||null});
  if(paid) S.purchases.push({date,label:`${fmt(rounds)} rd ${cal}${type==="defensive"?" (defensive)":""}`,paid});
}
function backupName(){const d=new Date(); return `armory-${today()}-${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}.json`;}
function backupJSON(){return JSON.stringify(Object.assign({},S,{exportedAt:new Date().toISOString(),app:"Armory"}),null,2);}
function markBackedUp(){S.meta.lastBackup=new Date().toISOString(); S.meta.changes=0; commit(false);}
function parseBackup(text){ try{const o=JSON.parse(text); if(!o||o.v!==1||!Array.isArray(o.guns)) return null; return o;}catch(e){return null} }
const hasData=st=>!!(st&&((st.guns||[]).length||(st.notes||[]).length||(st.list||[]).length||Object.keys(st.ammo||{}).length));
const savedAtOf=o=>(o.meta&&o.meta.savedAt)||o.exportedAt||null;

/* meta: {name, source:"file"|"drop"|"paste"|"autosave", handle?} */
function restore(text,meta){
  meta=meta||{};
  const o=parseBackup(text);
  if(!o){ toast(meta.name&&!/armory/i.test(meta.name)?`"${meta.name}" isn't an Armory backup. Backups are named like armory-2026-10-28-1452.json.`:"That file isn't an Armory backup. Pick the .json file you saved from this app."); return; }
  if(!hasData(S)){ applyRestore(o,meta); return; }
  UI.pendingRestore={o,meta}; UI.modal={t:"restore"}; render();
}
function applyRestore(o,meta){
  delete o.exportedAt; delete o.app;
  S=migrate(Object.assign(fresh(),o)); S.meta.lastBackup=S.meta.lastBackup||new Date().toISOString();
  UI.pendingRestore=null; UI.fileNewer=null; UI.tab="overview"; UI.modal=null;
  if(meta&&meta.handle){ UI.fileHandle=meta.handle; UI.fileOk=true; idbSet("fileHandle",meta.handle); }

/* the auto-save file: read it before ever writing to it, and offer it when it's newer */
async function checkAutoFile(){
  if(!UI.fileHandle||!UI.fileOk){ UI.fileChecked=false; return; }
  try{ const f=await UI.fileHandle.getFile(); const o=parseBackup(await f.text());
    UI.fileChecked=true;
    if(o&&hasData(o)&&(!hasData(S)||String(savedAtOf(o))>String(S.meta.savedAt))) UI.fileNewer={o,name:UI.fileHandle.name};
    else { UI.fileNewer=null; await persistNow(); }
  }catch(e){ UI.fileOk=false; UI.fileChecked=false; }
  render();
}
function fileNewerBanner(){
  if(UI.fileNewer) return `<div class="banner"><strong>Your auto-save file has newer data.</strong><span class="small"><span class="mono">${esc(UI.fileNewer.name)}</span> was saved ${esc(fmtWhen(savedAtOf(UI.fileNewer.o)))}. This browser's copy is from ${esc(fmtWhen(S.meta.savedAt))}. Auto-save is paused until you choose.</span><div class="row" style="margin-left:auto"><button class="btn sm primary" data-act="loadAutoFile">Load the file</button><button class="btn sm" data-act="keepBrowser">Keep this browser's copy</button></div></div>`;
  if(UI.fileHandle&&!UI.fileOk) return `<div class="banner"><strong>Auto-save to your file is paused.</strong><span class="small">The browser needs your OK again after a restart. Reconnecting also checks the file for newer data.</span><button class="btn sm primary" data-act="reconnect" style="margin-left:auto">Reconnect</button></div>`;
  return "";
}

  if(t.dataset.notegun){const o=t.selectedOptions[0], c=o&&o.dataset.cal, sel=document.getElementById("rn-cal"); if(c&&sel){ if(![...sel.options].some(x=>x.value===c)) sel.add(new Option(c,c)); sel.value=c; } return;}
  if(t.dataset.notefilter){UI.noteFilter=t.value; render(); return;}
  if(t.dataset.pickcat){const st=UI.pick[t.dataset.pickcat]; st.cat=t.value; st.q=""; st.hi=0; render(); const i=document.getElementById("ap-q-"+t.dataset.pickcat); if(i) i.focus(); return;}
  if(t.dataset.pickcost){UI.pick[t.dataset.pickcost].cost=t.value; return;}
  if(t.dataset.accost){const a=S.acc.find(x=>x.id===t.dataset.accost); if(a){a.cost=t.value===""?"":+t.value; commit();} return;}
  if(t.dataset.mount){const a=S.acc.find(x=>x.id===t.dataset.mount); if(a&&t.value){a.gun=t.value; commit(); toast(`Mounted ${a.name}`);} return;}
  if(t.dataset.est){S.plan.est[t.dataset.est]=+t.value||0; commit(); return;}
  if(t.id==="restoreFile"||t.id==="restoreFile2"){const f=t.files&&t.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>restore(String(r.result),{name:f.name,source:"file"}); r.readAsText(f); t.value="";}
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.combo){const st=UI.pick[t.dataset.combo]; st.q=t.value; st.hi=0; comboList(t.dataset.combo); return;}
  if(t.id==="inv-q"){UI.invQ=t.value; render(); return;} if(t.form&&t.form.dataset.form==="buyAmmo"){const fd=new FormData(t.form); const r=+fd.get("rounds"), p=+fd.get("paid"); const out=document.getElementById("ba-cpr"); if(out) out.textContent=r>0&&p>0?`${money(p)} for ${fmt(r)} rd = ${cents(p/r)} per round`:"Enter rounds and total paid to see ¢ per round.";}});
document.addEventListener("submit",e=>{e.preventDefault(); const f=e.target, fd=new FormData(f);
  if(f.dataset.form==="buyAmmo"){const r=+fd.get("rounds"); if(!r){toast("Enter how many rounds you bought."); return;} addAmmo(fd.get("cal"),r,+fd.get("paid")||0,fd.get("type"),fd.get("date")||today()); commit(); toast(`Added ${fmt(r)} rd of ${fd.get("cal")}`);}
  if(f.dataset.form==="range"){const cal=fd.get("cal"), r=+fd.get("rounds"); if(!r){toast("Enter how many rounds you shot."); return;} const a=S.ammo[cal]||(S.ammo[cal]={count:0,defensive:0,lots:[]}); const used=Math.min(r,a.count); const practice=a.count-a.defensive; if(used>practice) a.defensive=Math.max(0,a.defensive-(used-practice)); a.count-=used; S.log.push({date:fd.get("date")||today(),cal,delta:-used,reason:"range",cost:used*cpr(cal)}); commit(); toast(`Logged ${fmt(used)} rd of ${cal}${S.costTracking?`, about ${money(used*cpr(cal))}`:""}`);}
  if(f.dataset.form==="item"){const d=UI.itemDraft; const v=k=>{const x=fd.get(k); return x==null?undefined:String(x).trim();};
    ["cat","accCat","cal","load","gunType","name","gun","gearFlag","prio","month","url","notes"].forEach(k=>{const x=v(k); if(x!==undefined) d[k]=x;});
    ["rounds","est","qty"].forEach(k=>{const x=v(k); if(x!==undefined) d[k]=x===""?"":+x;});
    if(d.cat==="ammo"&&!d.name) d.name=`${d.rounds?fmt(d.rounds)+" rd ":""}${d.cal||"ammo"}${d.load==="defensive"?" (defensive)":""}`;
    if(!d.name){toast("Give the item a name."); return;}
    if(d.url&&!/^https?:\/\//.test(d.url)) d.url="https://"+d.url;
    if(d.cat==="ammo"&&!d.est&&d.rounds&&d.cal) d.est=Math.round(d.rounds*cpr(d.cal)*100)/100;
    if(d.id){Object.assign(S.list.find(x=>x.id===d.id),d);} else S.list.push(Object.assign({id:uid(),status:"want"},d));
    UI.modal=null; commit(); toast(d.id?"Saved":`Added to ${LISTCAT_NAME[d.cat]}`); return;}
  if(f.dataset.form==="itemBuy"){const it=S.list.find(x=>x.id===UI.modal.id); const paid=+fd.get("paid")||0, date=fd.get("date")||today();
    if(it.cat==="ammo"){const r=+fd.get("rounds")||+it.rounds||0; if(r&&it.cal) addAmmo(it.cal,r,paid,fd.get("load")||it.load,date); else S.purchases.push({date,label:it.name,paid});}
    else { S.purchases.push({date,label:it.name,paid});
      if(it.cat==="mags"){const g=S.guns.find(x=>x.id===it.gun); if(g){g.mags=(+g.mags||0)+Math.max(1,+it.qty||1); g.magCost=(+g.magCost||0)+paid;}}
      else if((it.cat==="optics"||it.cat==="parts")&&it.accCat){S.acc.push({id:uid(),cat:it.accCat,name:it.name,gun:it.gun||null,cost:paid||""}); if(["optic","light","sling"].includes(it.accCat)) S.gear[it.accCat]=true;}
      else if(it.gearFlag) S.gear[it.gearFlag]=true; }
    it.status="bought"; it.boughtDate=date; it.paid=paid;
    if(it.cat==="firearm"){UI.add={type:it.gunType||"rifle"}; UI.modal={t:"add"}; commit(); toast("Bought. Now log the gun."); return;}
    UI.modal=null; commit(); toast("Saved. Scores updated."); return;}
  if(f.dataset.form==="note"){const v=k=>String(fd.get(k)||"").trim(); const rec={date:v("date")||today(),gun:v("gun"),cal:v("cal"),rounds:v("rounds")===""?"":+v("rounds"),load:v("load"),dist:v("dist"),group:v("group"),drills:v("drills"),malf:v("malf")===""?"":+v("malf"),malfNote:v("malfNote"),cond:v("cond"),text:v("text")};
    if(!rec.rounds&&!rec.text&&!rec.drills){toast("Add rounds fired, what you worked on, or a note."); return;}
    if(UI.noteEdit){const n=S.notes.find(x=>x.id===UI.noteEdit); Object.assign(n,rec); UI.noteEdit=null; commit(); toast("Note updated"); return;}
    const n=Object.assign({id:uid()},rec); S.notes.push(n);
    let msg="Range note saved";
    if(fd.get("sub")&&rec.rounds&&rec.cal){const a=S.ammo[rec.cal]||(S.ammo[rec.cal]={count:0,defensive:0,lots:[]}); const used=Math.min(rec.rounds,a.count); const practice=a.count-a.defensive; if(used>practice) a.defensive=Math.max(0,a.defensive-(used-practice)); a.count-=used; S.log.push({date:rec.date,cal:rec.cal,delta:-used,reason:"range",cost:used*cpr(rec.cal),note:n.id}); msg+=`, ${fmt(used)} rd taken off ${rec.cal}`;}
    UI.noteGun=null; commit(); toast(msg); window.scrollTo(0,0); return;}
  if(f.dataset.form==="bought"){const fx0=fixes().find(x=>x.key===UI.modal.k); if(fx0){applyBought(fx0,fd); UI.modal=null; commit(); toast("Saved. Scores updated.");}}
});
document.addEventListener("toggle",e=>{const t=e.target; if(!t.dataset) return; if(t.dataset.month){UI.openMonths=UI.openMonths||{}; UI.openMonths[t.dataset.month]=t.open;} if(t.dataset.cat) UI.openCats[t.dataset.cat]=t.open; if(t.dataset.more) UI.openMore=t.open;},true);
let dragDepth=0;
const isFileDrag=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes("Files");
document.addEventListener("dragenter",e=>{ if(!isFileDrag(e)) return; e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
document.addEventListener("dragover",e=>{ if(!isFileDrag(e)) return; e.preventDefault(); e.dataTransfer.dropEffect="copy"; });
document.addEventListener("dragleave",e=>{ if(!isFileDrag(e)) return; dragDepth=Math.max(0,dragDepth-1); if(!dragDepth) document.body.classList.remove("dragging"); });
document.addEventListener("drop",e=>{ if(!isFileDrag(e)) return; e.preventDefault(); dragDepth=0; document.body.classList.remove("dragging");
  const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(!f) return;
  if(!/\.json$/i.test(f.name)&&f.type!=="application/json"){ toast(`"${f.name}" isn't a backup file. Backups end in .json.`); return; }
  const r=new FileReader(); r.onload=()=>restore(String(r.result),{name:f.name,source:"drop"}); r.readAsText(f); });
document.addEventListener("focusin",e=>{const t=e.target; if(t.dataset&&t.dataset.combo) comboList(t.dataset.combo);});
document.addEventListener("mousedown",e=>{ if(!e.target.closest(".combo")) Object.keys(UI.pick).forEach(comboClose); });
document.addEventListener("keydown",e=>{const t=e.target;
  if(t.dataset&&t.dataset.combo){const ctx=t.dataset.combo, st=UI.pick[ctx]; if(!st) return;
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault(); if(document.getElementById("ap-list-"+ctx).hidden) comboList(ctx); const n=(st.opts||[]).length; if(n){st.hi=(st.hi+(e.key==="ArrowDown"?1:-1)+n)%n; comboList(ctx);} return;}
    if(e.key==="Enter"){e.preventDefault(); const box=document.getElementById("ap-list-"+ctx); if(!box.hidden&&st.opts&&st.opts.length){A.comboPick({ctx,i:st.hi});} else A.accAdd({ctx}); return;}
    if(e.key==="Escape"){comboClose(ctx); e.preventDefault(); return;}
    if(e.key==="Tab") comboClose(ctx);
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&UI.modal&&!e.defaultPrevented){UI.modal=null; render();}});

loadState().then(async()=>{render(); if(S.guns.length&&!UI.persisted) askPersist(); if(UI.fileHandle&&UI.fileOk) await checkAutoFile();});
render();
})();
</script>

</body>
</html>
